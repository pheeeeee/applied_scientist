# Configuration for 2v2 Soccer task on a SLURM cluster with 4 GPUs

system:
  time_budget: 1800
  n_gpus: 4
  baseline_seeds: 3
  eval_samples: 100
  early_stop_fraction: 0.4
  max_spec_review_rounds: 3
  queue_throttle_high: 10
  queue_throttle_low: 5
  timeout_multiplier: 2.0

tuning:
  enabled: true
  max_iterations: 15
  min_iterations: 3

llm:
  explorer:
    backend: anthropic
    model: claude-haiku-4-5-20251001
  critic:
    backend: anthropic
    model: claude-sonnet-4-6
  builder:
    backend: anthropic
    model: claude-sonnet-4-6
  debugger:                              # Diagnoses job failures (optional, defaults to builder's model)
    backend: anthropic
    model: claude-haiku-4-5-20251001     # Haiku is sufficient for error diagnosis
  orchestrator:
    backend: anthropic
    model: claude-haiku-4-5-20251001

compute:
  backend: slurm
  slurm:
    account: YOUR_ACCOUNT             # REQUIRED on PACE - your PI's account (e.g., gts-mypi)
    partition: gpu-v100               # or gpu-a100
    gres: "gpu:V100:1"                # explicit GPU type recommended
    mem: "48G"
    time: "01:00:00"
    setup_commands:
      - "source ~/miniconda3/etc/profile.d/conda.sh"
      - "conda activate soccer_env"
      # Add applied_scientist to PYTHONPATH if not pip installed:
      # - "export PYTHONPATH=/path/to/applied-scientist:${PYTHONPATH:-}"

task:
  module: tasks/examples/soccer_twos

paths:
  workspace: ./workspace
  results: ./workspace/results
  configs: ./workspace/configs
  checkpoints: ./workspace/results/checkpoints
  logs: ./workspace/results/logs
