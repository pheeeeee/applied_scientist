name: ppo_baseline
description: "Standard PPO baseline with default hyperparameters"
source_paper: "Schulman et al. 2017 (PPO)"
architecture:
  type: independent_ppo
  policy:
    structure: "FC, 2 layers, 256 units, ReLU"
    input: "per-agent observation (84 floats)"
    output: "action logits (27)"
why_it_might_work: "Standard baseline for comparison"
task_config:
  variation: multiagent_player
  single_player: false
  flatten_branched: true
training_config:
  lr: 0.0003
  train_batch_size: 12000
  rollout_fragment_length: 1000
  gamma: 0.99
  entropy_coeff: 0.01
resource_estimate:
  memory: "~4GB"
  training_time: "Standard"
confidence: high
category: baseline
tags: [baseline, ppo]
